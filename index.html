<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f21c26" />
<title>Nabati Field Visit Intelligence</title>
<style>
:root{
  --red:#f21c26; --red-dark:#c9141d; --ink:#17202a; --muted:#667085; --line:#e5e7eb;
  --bg:#f7f8fa; --card:#fff; --good:#16794b; --warn:#a15c00; --bad:#ba1a1a; --blue:#2457d6;
  --radius:16px; --shadow:0 8px 28px rgba(16,24,40,.08);
}
*{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}.app{max-width:1180px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.logo{width:48px;height:34px;object-fit:contain}.brand{min-width:0}.brand-title{font-weight:850;letter-spacing:-.02em;font-size:15px}.brand-sub{font-size:11px;color:var(--muted)}
.version{margin-left:auto;font-size:10px;color:var(--muted);padding:4px 7px;border:1px solid var(--line);border-radius:999px;background:white}
main{padding:14px}.screen{display:none}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(145deg,#fff 0,#fff 60%,#fff3f3 100%)}
h1,h2,h3,p{margin-top:0}h1{font-size:26px;letter-spacing:-.04em;margin-bottom:8px}h2{font-size:19px;letter-spacing:-.02em;margin-bottom:10px}h3{font-size:15px;margin-bottom:8px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}
.btn{appearance:none;border:none;border-radius:12px;padding:13px 15px;font-weight:800;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-primary{background:var(--red);color:#fff}.btn-primary:active{background:var(--red-dark)}.btn-secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-soft{background:#fff3f3;color:#a91019}.btn-danger{background:#fff0f0;color:var(--bad);border:1px solid #ffd3d3}.btn-block{width:100%}.btn-row{display:flex;gap:8px;flex-wrap:wrap}.btn-row .btn{flex:1}
label{font-size:12px;font-weight:800;color:#344054;display:block;margin-bottom:6px}.field{margin-bottom:14px}.input,.select,.textarea{width:100%;border:1px solid #d8dce3;background:#fff;border-radius:12px;padding:12px 12px;font-size:16px;color:var(--ink);outline:none}.textarea{min-height:86px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:#ef7b80;box-shadow:0 0 0 3px rgba(242,28,38,.1)}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr;gap:10px}.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.chip{border:1px solid #d9dde4;background:#fff;border-radius:12px;min-height:48px;padding:9px 10px;text-align:left;font-size:13px;font-weight:750;color:#344054;cursor:pointer}.chip.selected{border-color:var(--red);background:#fff1f2;color:#a80f18;box-shadow:0 0 0 2px rgba(242,28,38,.08)}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result-btn{border-radius:16px;min-height:76px;font-size:20px;font-weight:900;border:1px solid var(--line);background:white;cursor:pointer}.result-btn.ec{color:var(--good)}.result-btn.ne{color:var(--bad)}.result-btn.selected.ec{background:#eaf8f1;border-color:#8bd1ae}.result-btn.selected.ne{background:#fff0f0;border-color:#ffb3b3}
.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.kpi-v{font-size:24px;font-weight:900;letter-spacing:-.04em}.kpi-l{font-size:11px;color:var(--muted);font-weight:700}.kpi-good .kpi-v{color:var(--good)}.kpi-bad .kpi-v{color:var(--bad)}
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.stat-mini{background:#f8f9fb;border-radius:10px;padding:8px;text-align:center}.stat-mini b{display:block;font-size:18px}.stat-mini span{font-size:10px;color:var(--muted);font-weight:700}
.stepper{display:flex;gap:5px;margin-bottom:14px}.step-dot{height:5px;flex:1;border-radius:999px;background:#eceef2}.step-dot.on{background:var(--red)}
.call-stage{display:none}.call-stage.active{display:block}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:850}.badge-good{background:#e9f7ef;color:var(--good)}.badge-warn{background:#fff5df;color:var(--warn)}.badge-bad{background:#fff0f0;color:var(--bad)}.badge-muted{background:#f0f2f5;color:#596273}.badge-blue{background:#edf2ff;color:var(--blue)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section-head h2{margin:0}.list{display:flex;flex-direction:column;gap:8px}.list-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}.list-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.list-title{font-weight:850}.list-meta{font-size:11px;color:var(--muted);margin-top:3px}.metrics-inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.metric-pill{font-size:11px;padding:5px 7px;background:#f5f6f8;border-radius:999px;font-weight:700}
.empty{padding:24px 10px;text-align:center;color:var(--muted)}.empty strong{display:block;color:#475467;margin-bottom:4px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(4,1fr)}.nav-btn{background:none;border:none;color:#7a8290;padding:7px 4px;font-size:10px;font-weight:800;cursor:pointer}.nav-btn span{display:block;font-size:19px;line-height:1.2}.nav-btn.active{color:var(--red)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:11px;text-align:left;vertical-align:top}.table th{background:#f7f8fa;font-weight:850;position:sticky;top:0}.matrix th,.matrix td{text-align:center;min-width:70px}.matrix td.hot{background:#fff1f2;font-weight:850;color:#a80f18}.matrix td.diag{background:#ebf8f1;font-weight:850;color:#106d43}
.finding{border-left:4px solid var(--red);padding:12px 12px 12px 14px;background:#fff;border-radius:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:9px}.finding-title{font-weight:900;margin-bottom:4px}.finding-evidence{font-size:12px;color:var(--muted);line-height:1.45}.notice{padding:11px 12px;border-radius:12px;background:#fff8e8;color:#744800;font-size:12px;border:1px solid #ffe0a3}.good-note{background:#eef9f3;color:#16633f;border-color:#b9e2cb}.danger-note{background:#fff2f2;color:#9e1a1a;border-color:#ffcaca}
.toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:3px;margin-bottom:12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 11px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer}.tab.active{background:#191d24;color:white;border-color:#191d24}
hr{border:none;border-top:1px solid var(--line);margin:16px 0}.right{text-align:right}.hidden{display:none!important}.danger-text{color:var(--bad)}.good-text{color:var(--good)}
.reason-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}.reason-row .input{font-size:13px;padding:9px}.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(12px);opacity:0;transition:.2s;background:#1d2939;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:750;z-index:99;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#qaPanel{display:none}
@media(min-width:720px){main{padding:20px}.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.chips{grid-template-columns:repeat(3,minmax(0,1fr))}.bottom-nav{left:50%;transform:translateX(-50%);max-width:700px;border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0}.topbar{border-radius:0 0 14px 14px}.app{padding-bottom:92px}.desktop-cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:14px;align-items:start}.desktop-sticky{position:sticky;top:78px}.reason-row{grid-template-columns:1fr 1fr 42px}}
@media print{body{background:#fff}.topbar,.bottom-nav,.no-print,.toast{display:none!important}.app{max-width:none;padding:0}main{padding:0}.screen{display:none!important}#analysisScreen{display:block!important}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.toolbar,.analysis-actions{display:none!important}.table-wrap{overflow:visible}.table{min-width:0}.finding{break-inside:avoid}@page{size:A4;margin:12mm}}
</style>
</head>

<script>
(() => {
'use strict';
const VERSION='0.1.0';
const STORAGE_KEY='nabati_fvi_v0_1';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const uid=(p='id')=>`${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const pct=(n,d)=>d?Math.round((n/d)*1000)/10:0;
const fmtDate=v=>{if(!v)return''; const d=new Date(v+'T00:00:00'); return isNaN(d)?v:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
const nowISO=()=>new Date().toISOString();
const today=()=>{const d=new Date(); const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`};
const clone=o=>JSON.parse(JSON.stringify(o));

const DEFAULT_REASONS=[
 {id:'pic',observed:'PIC Availability',sfa:'PIC Availability'},
 {id:'stock',observed:'Stock Still Available',sfa:'Stock'},
 {id:'financial',observed:'Financial / Cash',sfa:'Financial'},
 {id:'closed',observed:'Store Closed',sfa:'Store Closed'},
 {id:'price',observed:'Price',sfa:'Price'},
 {id:'refusal',observed:'No Need / Refusal',sfa:'No Need / Refusal'},
 {id:'competitor',observed:'Competitor',sfa:'Competitor'},
 {id:'product',observed:'Product Issue',sfa:'Product Issue'},
 {id:'other',observed:'Other',sfa:'Other'},
 {id:'unclear',observed:'Unclear',sfa:'Unclear'}
];
const DEFAULT_STATE={
 version:VERSION,
 settings:{observer:'',reasons:DEFAULT_REASONS,thresholds:{highAccuracy:80,mediumAccuracy:60,mismatchFlag:30,minReasonSample:3,catchAllMismatchCount:3}},
 visits:[],selectedVisitId:null
};

const Store={
 load(){try{const raw=localStorage.getItem(STORAGE_KEY); if(!raw)return clone(DEFAULT_STATE); const x=JSON.parse(raw); return this.migrate(x)}catch(e){console.warn(e);return clone(DEFAULT_STATE)}},
 migrate(x){x=x&&typeof x==='object'?x:{}; x.version=VERSION; x.settings={...clone(DEFAULT_STATE.settings),...(x.settings||{})}; x.settings.thresholds={...DEFAULT_STATE.settings.thresholds,...(x.settings.thresholds||{})}; if(!Array.isArray(x.settings.reasons)||!x.settings.reasons.length)x.settings.reasons=clone(DEFAULT_REASONS); if(!Array.isArray(x.visits))x.visits=[]; return x},
 save(){state.version=VERSION; localStorage.setItem(STORAGE_KEY,JSON.stringify(state))},
 activeVisit(){return state.visits.find(v=>v.status==='active')||null},
 visit(id){return state.visits.find(v=>v.id===id)||null},
 upsertVisit(v){const i=state.visits.findIndex(x=>x.id===v.id); if(i>=0)state.visits[i]=v; else state.visits.unshift(v); state.selectedVisitId=v.id; this.save()},
 deleteVisit(id){state.visits=state.visits.filter(v=>v.id!==id); if(state.selectedVisitId===id)state.selectedVisitId=null; this.save()},
 resetAll(){state=clone(DEFAULT_STATE); this.save()}
};
let state=Store.load();
let draft=null;
let callStage=0;
let editingCallId=null;
let analysisTab='overview';

const Domain={
 newVisit(data){return {id:uid('visit'),date:data.date||today(),depot:data.depot.trim(),salesman:data.salesman.trim(),salesmanId:data.salesmanId?.trim()||'',observer:data.observer.trim(),routeTeam:data.routeTeam?.trim()||'',notes:data.notes?.trim()||'',status:'active',startedAt:nowISO(),endedAt:null,calls:[]}},
 newCall(){return {id:uid('call'),seq:0,outletName:'',outletId:'',routeStatus:'JKS',result:null,observedPrimaryId:null,observedSecondaryId:null,evidence:'',sfaReasonId:null,reasonStatusAuto:null,reasonStatusFinal:null,overrideNote:'',sfaSelectionWhy:'',followupPlan:null,canRevisitEarlier:null,constraint:'',quickNote:'',createdAt:nowISO(),updatedAt:nowISO()}},
 classify(call){if(call.result!=='NON_EC')return null; if(!call.observedPrimaryId||call.observedPrimaryId==='unclear'||!call.sfaReasonId||call.sfaReasonId==='unclear')return'UNCLEAR'; if(call.sfaReasonId===call.observedPrimaryId)return'MATCH'; if(call.observedSecondaryId&&call.sfaReasonId===call.observedSecondaryId)return'PARTIAL'; return'MISMATCH'},
 saveCall(visit,call,editId=null){call=clone(call); call.reasonStatusAuto=this.classify(call); call.reasonStatusFinal=call.reasonStatusAuto; call.updatedAt=nowISO(); if(editId){const i=visit.calls.findIndex(x=>x.id===editId); if(i>=0){call.id=editId;call.seq=visit.calls[i].seq;call.createdAt=visit.calls[i].createdAt||call.createdAt;visit.calls[i]=call;}else{call.seq=visit.calls.length+1;visit.calls.push(call)}}else{call.seq=visit.calls.length+1;visit.calls.push(call)} visit.calls.sort((a,b)=>a.seq-b.seq);visit.calls.forEach((c,i)=>c.seq=i+1);Store.upsertVisit(visit); return call},
 label(id,type='observed'){const r=state.settings.reasons.find(x=>x.id===id); return r?r[type]||r.observed:id||''},
 statusBadge(s){return s==='MATCH'?'Match':s==='PARTIAL'?'Partial':s==='MISMATCH'?'Mismatch':'Unclear'}
};

const Analyzer={
 visit(v){
  const calls=v?.calls||[]; const sc=calls.length,ec=calls.filter(c=>c.result==='EC').length,ne=calls.filter(c=>c.result==='NON_EC').length;
  const reasonCalls=calls.filter(c=>c.result==='NON_EC');
  const status={MATCH:0,PARTIAL:0,MISMATCH:0,UNCLEAR:0}; reasonCalls.forEach(c=>status[c.reasonStatusFinal||c.reasonStatusAuto||'UNCLEAR']++);
  const evaluable=status.MATCH+status.PARTIAL+status.MISMATCH;
  const exactRate=pct(status.MATCH,evaluable); const mismatchRate=pct(status.MISMATCH,evaluable);
  const jks=calls.filter(c=>c.routeStatus==='JKS').length;
  const observedCounts={},sfaCounts={},followCounts={},matrix={};
  reasonCalls.forEach(c=>{
    const o=c.observedPrimaryId||'unclear',s=c.sfaReasonId||'unclear'; observedCounts[o]=(observedCounts[o]||0)+1;sfaCounts[s]=(sfaCounts[s]||0)+1;followCounts[c.followupPlan||'Unknown']=(followCounts[c.followupPlan||'Unknown']||0)+1; matrix[s]=matrix[s]||{};matrix[s][o]=(matrix[s][o]||0)+1;
  });
  const bySfa={}; Object.keys(sfaCounts).forEach(id=>{const arr=reasonCalls.filter(c=>(c.sfaReasonId||'unclear')===id);const st={MATCH:0,PARTIAL:0,MISMATCH:0,UNCLEAR:0};arr.forEach(c=>st[c.reasonStatusFinal||c.reasonStatusAuto||'UNCLEAR']++);const ev=st.MATCH+st.PARTIAL+st.MISMATCH;bySfa[id]={n:arr.length,...st,exactRate:pct(st.MATCH,ev),mismatchRate:pct(st.MISMATCH,ev)}});
  const findings=this.findings({sc,ec,ne,status,evaluable,exactRate,mismatchRate,observedCounts,sfaCounts,followCounts,matrix,bySfa,reasonCalls});
  return {sc,ec,ne,ecsc:pct(ec,sc),jks,off:sc-jks,status,evaluable,exactRate,mismatchRate,observedCounts,sfaCounts,followCounts,matrix,bySfa,reasonCalls,findings};
 },
 findings(a){
  const t=state.settings.thresholds; const out=[];
  if(a.evaluable<5){out.push({level:'neutral',title:'Sample is still limited',text:`Only ${a.evaluable} Non-EC cases can currently be evaluated for reason accuracy. Treat early percentages as directional, not conclusive.`})}
  const reliability=a.evaluable<5?'Insufficient sample':a.exactRate>=t.highAccuracy?'High':a.exactRate>=t.mediumAccuracy?'Medium':'Low';
  out.push({level:reliability==='Low'?'bad':reliability==='Medium'?'warn':'good',title:`Non-EC reason reliability: ${reliability}`,text:a.evaluable?`Exact match is ${a.exactRate}% across ${a.evaluable} evaluable Non-EC cases.`:'No evaluable Non-EC cases yet.'});
  const candidates=Object.entries(a.bySfa).filter(([,x])=>x.n>=t.minReasonSample).sort((A,B)=>B[1].mismatchRate-A[1].mismatchRate);
  if(candidates.length){const [id,x]=candidates[0]; if(x.mismatchRate>=t.mismatchFlag)out.push({level:'bad',title:`Potential reason reliability issue: ${Domain.label(id,'sfa')}`,text:`Mismatch is ${x.mismatchRate}% across ${x.n} recorded cases for this SFA reason. Review outlet-level evidence before changing taxonomy or governance.`});}
  for(const [id,x] of candidates){const mism=a.reasonCalls.filter(c=>c.sfaReasonId===id&&(c.reasonStatusFinal||c.reasonStatusAuto)==='MISMATCH'); const actual=new Set(mism.map(c=>c.observedPrimaryId).filter(Boolean)); if(mism.length>=t.catchAllMismatchCount&&actual.size>=2){out.push({level:'warn',title:`Possible broad/default classification: ${Domain.label(id,'sfa')}`,text:`Its ${mism.length} mismatches map to ${actual.size} different observed reasons. This is a field signal to investigate classification fit, UX, habit, or reporting incentives—not proof of intentional miscoding.`});break;}}
  const pic=a.reasonCalls.filter(c=>c.observedPrimaryId==='pic'); if(pic.length>=3){const d1=pic.filter(c=>c.followupPlan==='D+1').length;const share=pct(d1,pic.length);const timingSet=new Set(pic.map(c=>c.followupPlan).filter(Boolean)); if(timingSet.size>1)out.push({level:'neutral',title:'PIC follow-up timing is not consistent',text:`Among ${pic.length} observed PIC cases, ${share}% are planned for D+1 while other cases use different timing. This is a candidate for controlled follow-up validation, not yet a proven treatment.`});}
  const nextJks=a.reasonCalls.filter(c=>c.followupPlan==='Next JKS').length; if(a.ne>=3&&pct(nextJks,a.ne)>=50)out.push({level:'warn',title:'Follow-up is concentrated on Next JKS',text:`${pct(nextJks,a.ne)}% of Non-EC cases are planned for the next JKS. Field notes should be reviewed to determine whether route constraints, outlet instructions, or other factors drive this pattern.`});
  return out;
 }
};

  if(analysisTab==='followup'){const rows=Object.entries(a.followCounts).sort((A,B)=>B[1]-A[1]);return `<div class="card"><h2>Planned Follow-Up</h2>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Plan</th><th>Count</th><th>Share of Non-EC</th></tr></thead><tbody>${rows.map(([k,n])=>`<tr><td><b>${esc(k)}</b></td><td>${n}</td><td>${pct(n,a.ne)}%</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No follow-up data yet.</div>`}<hr><p class="small muted">v0.1 captures planned follow-up. Actual recovery (revisited / recovered EC / repeated Non-EC) is intentionally not inferred until a later visit result is recorded in a future version.</p></div>`}
  if(analysisTab==='evidence'){const rows=a.reasonCalls;return `<div class="card"><h2>Outlet-Level Evidence</h2>${rows.length?`<div class="list">${rows.map(c=>`<div class="list-card"><div class="list-top"><div><div class="list-title">#${c.seq} · ${esc(c.outletName||c.outletId||'Outlet')}</div><div class="list-meta">Observed: ${esc(Domain.label(c.observedPrimaryId))} · SFA: ${esc(Domain.label(c.sfaReasonId,'sfa'))}</div></div><span class="badge ${c.reasonStatusFinal==='MATCH'?'badge-good':c.reasonStatusFinal==='MISMATCH'?'badge-bad':c.reasonStatusFinal==='PARTIAL'?'badge-warn':'badge-muted'}">${Domain.statusBadge(c.reasonStatusFinal||c.reasonStatusAuto)}</span></div>${c.evidence?`<div class="small" style="margin-top:8px"><b>Evidence:</b> ${esc(c.evidence)}</div>`:''}${c.sfaSelectionWhy?`<div class="small muted" style="margin-top:5px"><b>Why SFA reason:</b> ${esc(c.sfaSelectionWhy)}</div>`:''}<div class="small muted" style="margin-top:5px"><b>Follow-up:</b> ${esc(c.followupPlan||'Unknown')} ${c.constraint?'· '+esc(c.constraint):''}</div></div>`).join('')}</div>`:`<div class="empty">No Non-EC evidence captured yet.</div>`}</div>`}
  const visits=state.visits.filter(x=>x.calls.length);return `<div class="card"><h2>Compare Visits</h2><p class="small muted">Useful after multiple ride-alongs to see whether reason-coding patterns are systemic or session-specific.</p>${visits.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Depot</th><th>Salesman</th><th>SC</th><th>EC/SC</th><th>Exact Match</th><th>Mismatch</th><th>Non-EC</th></tr></thead><tbody>${visits.map(x=>{const z=Analyzer.visit(x);return `<tr data-select-analysis="${x.id}" style="cursor:pointer"><td>${fmtDate(x.date)}</td><td>${esc(x.depot)}</td><td>${esc(x.salesman)}</td><td>${z.sc}</td><td>${z.ecsc}%</td><td>${z.exactRate}%</td><td>${z.mismatchRate}%</td><td>${z.ne}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">No visits to compare.</div>`}</div>`},
 settings(){const el=document.getElementById('settingsScreen');const t=state.settings.thresholds;el.innerHTML=`<div class="card"><h1>Settings</h1><p class="muted">Business parameters are configurable; field data is stored locally in this browser.</p><div class="field"><label>Default Observer</label><input id="settingObserver" class="input" value="${esc(state.settings.observer)}" placeholder="Observer name"></div><button class="btn btn-primary" data-action="saveSettings">Save Settings</button></div><div class="card"><h2>Reason Taxonomy Mapping</h2><p class="small muted">Each row is one canonical reason with an observed label and the corresponding SFA label. This allows “Stock Still Available” to match “Stock” without manual recoding.</p><div id="reasonSettings">${state.settings.reasons.map((r,i)=>`<div class="reason-row" data-reason-row="${i}"><input class="input reason-observed" value="${esc(r.observed)}" aria-label="Observed label"><input class="input reason-sfa" value="${esc(r.sfa)}" aria-label="SFA label"><button class="icon-btn" data-delete-reason="${i}" title="Delete">×</button></div>`).join('')}</div><button class="btn btn-secondary" data-action="addReason">+ Add Reason</button><button class="btn btn-primary" style="margin-left:6px" data-action="saveReasons">Save Taxonomy</button></div><div class="card"><h2>Conclusion Thresholds</h2><div class="grid2"><div class="field"><label>High accuracy ≥ %</label><input id="thHigh" class="input" type="number" value="${t.highAccuracy}" min="0" max="100"></div><div class="field"><label>Medium accuracy ≥ %</label><input id="thMed" class="input" type="number" value="${t.mediumAccuracy}" min="0" max="100"></div><div class="field"><label>Mismatch flag ≥ %</label><input id="thMismatch" class="input" type="number" value="${t.mismatchFlag}" min="0" max="100"></div><div class="field"><label>Minimum cases / reason</label><input id="thMin" class="input" type="number" value="${t.minReasonSample}" min="1"></div></div><button class="btn btn-primary" data-action="saveThresholds">Save Thresholds</button></div><div class="card"><h2>Data & Backup</h2><p class="small muted">GitHub Pages hosts the application only. Field data stays in this browser unless you export it.</p><div class="grid3"><button class="btn btn-secondary" data-action="exportBackup">Export JSON Backup</button><label class="btn btn-secondary" style="cursor:pointer">Import JSON<input id="importBackup" type="file" accept="application/json" hidden></label><button class="btn btn-danger" data-action="resetAll">Reset All Local Data</button></div></div>`}
};

function persistDraftInputs(){const g=id=>document.getElementById(id); if(g('callOutlet'))draft.outletName=g('callOutlet').value; if(g('callOutletId'))draft.outletId=g('callOutletId').value;if(g('secondaryReason'))draft.observedSecondaryId=g('secondaryReason').value||null;if(g('evidence'))draft.evidence=g('evidence').value;if(g('sfaWhy'))draft.sfaSelectionWhy=g('sfaWhy').value;if(g('constraint'))draft.constraint=g('constraint').value;if(g('quickNote'))draft.quickNote=g('quickNote').value}
function resetDraft(){draft=Domain.newCall();callStage=0;editingCallId=null;}
function ensureOutlet(){persistDraftInputs();if(!draft.outletName.trim()&&!draft.outletId.trim()){UI.toast('Enter outlet name or ID');return false}return true}
function startNewVisit(form){const fd=new FormData(form);const active=Store.activeVisit();if(active){UI.toast('Finish the active visit first');return}const v=Domain.newVisit(Object.fromEntries(fd.entries()));state.settings.observer=v.observer;Store.upsertVisit(v);resetDraft();UI.renderAll();UI.show('visit')}
function endVisit(){const v=Store.activeVisit();if(!v)return;if(!confirm(`End visit with ${v.calls.length} recorded calls?`))return;v.status='completed';v.endedAt=nowISO();Store.upsertVisit(v);resetDraft();analysisTab='overview';UI.renderAll();UI.show('analysis')}
function editHistory(){const v=Store.activeVisit();if(!v)return;const rows=v.calls.map(c=>`<tr><td>${c.seq}</td><td>${esc(c.outletName||c.outletId)}</td><td>${c.routeStatus}</td><td>${c.result}</td><td>${c.result==='NON_EC'?esc(Domain.label(c.sfaReasonId,'sfa')):''}</td><td>${c.result==='NON_EC'?Domain.statusBadge(c.reasonStatusFinal||c.reasonStatusAuto):''}</td><td><div class="btn-row"><button class="icon-btn" data-edit-call="${c.id}">✎</button><button class="icon-btn" data-delete-call="${c.id}">×</button></div></td></tr>`).join('');document.getElementById('callWizard').innerHTML=`<h3>Current Call History</h3><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Outlet</th><th>Route</th><th>Result</th><th>SFA Reason</th><th>Status</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7">No calls yet.</td></tr>'}</tbody></table></div><button class="btn btn-secondary btn-block" style="margin-top:10px" data-action="backToEntry">Back to Call Entry</button>`}

function handleClick(e){const b=e.target.closest('button,[data-open-visit],[data-select-analysis]');if(!b)return;
 if(b.dataset.nav){const n=b.dataset.nav;if(n==='home'){UI.renderAll();UI.show('home')}else if(n==='field'){if(Store.activeVisit()){UI.visit();UI.show('visit')}else{UI.setup();UI.show('setup')}}else if(n==='analysis'){analysisTab='overview';UI.analysis();UI.show('analysis')}else{UI.settings();UI.show('settings')}return}
 if(b.dataset.openVisit){state.selectedVisitId=b.dataset.openVisit;Store.save();const v=Store.visit(b.dataset.openVisit);if(v?.status==='active'){UI.visit();UI.show('visit')}else{analysisTab='overview';UI.analysis();UI.show('analysis')}return}
 if(b.dataset.selectAnalysis){state.selectedVisitId=b.dataset.selectAnalysis;Store.save();analysisTab='overview';UI.analysis();return}
 if(b.dataset.analysisTab){analysisTab=b.dataset.analysisTab;UI.analysis();return}
 if(b.dataset.setRoute){persistDraftInputs();draft.routeStatus=b.dataset.setRoute;UI.visit();return}
 if(b.dataset.setResult){persistDraftInputs();draft.result=b.dataset.setResult;UI.visit();return}
 if(b.dataset.observed){persistDraftInputs();draft.observedPrimaryId=b.dataset.observed;if(draft.observedSecondaryId===draft.observedPrimaryId)draft.observedSecondaryId=null;UI.visit();return}
 if(b.dataset.sfa){persistDraftInputs();draft.sfaReasonId=b.dataset.sfa;draft.reasonStatusAuto=Domain.classify(draft);draft.reasonStatusFinal=draft.reasonStatusAuto;UI.visit();return}
 if(b.dataset.follow){persistDraftInputs();draft.followupPlan=b.dataset.follow;UI.visit();return}
 if(b.dataset.earlier){persistDraftInputs();draft.canRevisitEarlier=b.dataset.earlier;UI.visit();return}
 if(b.dataset.editCall){const v=Store.activeVisit();const c=v?.calls.find(x=>x.id===b.dataset.editCall);if(c){draft=clone(c);editingCallId=c.id;callStage=0;UI.visit();UI.toast('Editing call #'+c.seq)}return}
 if(b.dataset.deleteCall){const v=Store.activeVisit();if(confirm('Delete this call?')){v.calls=v.calls.filter(c=>c.id!==b.dataset.deleteCall);v.calls.forEach((c,i)=>c.seq=i+1);Store.upsertVisit(v);UI.visit();editHistory()}return}
 if(b.dataset.deleteReason!==undefined){const i=Number(b.dataset.deleteReason);if(state.settings.reasons.length<=2){UI.toast('Keep at least two reasons');return}state.settings.reasons.splice(i,1);Store.save();UI.settings();return}
 const a=b.dataset.action;if(!a)return;
 if(a==='newVisit'){UI.setup();UI.show('setup')}
 if(a==='resume'){UI.visit();UI.show('visit')}
 if(a==='nextStage'){persistDraftInputs();if(callStage===0&&!ensureOutlet())return;if(callStage===1&&!draft.observedPrimaryId){UI.toast('Select observed reason');return}if(callStage===2&&!draft.sfaReasonId){UI.toast('Select SFA reason');return}callStage=Math.min(3,callStage+1);UI.visit()}
 if(a==='prevStage'){persistDraftInputs();callStage=Math.max(0,callStage-1);UI.visit()}
 if(a==='saveEC'){if(!ensureOutlet())return;const v=Store.activeVisit();draft.result='EC';Domain.saveCall(v,draft,editingCallId);const wasEdit=!!editingCallId;resetDraft();UI.renderAll();UI.show('visit');UI.toast(wasEdit?'Call updated':'EC saved')}
 if(a==='saveNE'){persistDraftInputs();if(!draft.followupPlan){UI.toast('Select follow-up plan');return}const v=Store.activeVisit();draft.result='NON_EC';Domain.saveCall(v,draft,editingCallId);const wasEdit=!!editingCallId;resetDraft();UI.renderAll();UI.show('visit');UI.toast(wasEdit?'Call updated':'Non-EC saved')}
 if(a==='callHistory'){persistDraftInputs();editHistory()}
 if(a==='backToEntry'){UI.visit()}
 if(a==='liveAnalysis'){const v=Store.activeVisit();state.selectedVisitId=v.id;Store.save();analysisTab='overview';UI.analysis();UI.show('analysis')}
 if(a==='endVisit')endVisit();
 if(a==='exportExcel'){const v=Store.visit(state.selectedVisitId)||Store.activeVisit();if(v)Exporter.excel(v)}
 if(a==='printSummary')Exporter.print();
 if(a==='exportBackup')Exporter.backup();
 if(a==='saveSettings'){state.settings.observer=document.getElementById('settingObserver').value.trim();Store.save();UI.renderAll();UI.toast('Settings saved')}
 if(a==='addReason'){state.settings.reasons.push({id:uid('reason'),observed:'New Observed Reason',sfa:'New SFA Reason'});Store.save();UI.settings()}
 if(a==='saveReasons'){document.querySelectorAll('[data-reason-row]').forEach((row,i)=>{if(state.settings.reasons[i]){state.settings.reasons[i].observed=row.querySelector('.reason-observed').value.trim()||state.settings.reasons[i].observed;state.settings.reasons[i].sfa=row.querySelector('.reason-sfa').value.trim()||state.settings.reasons[i].sfa}});Store.save();UI.renderAll();UI.toast('Taxonomy saved')}
 if(a==='saveThresholds'){const n=id=>Number(document.getElementById(id).value);state.settings.thresholds.highAccuracy=n('thHigh');state.settings.thresholds.mediumAccuracy=n('thMed');state.settings.thresholds.mismatchFlag=n('thMismatch');state.settings.thresholds.minReasonSample=Math.max(1,n('thMin'));Store.save();UI.renderAll();UI.toast('Thresholds saved')}
 if(a==='resetAll'){if(confirm('Delete all locally stored field-visit data and settings from this browser?')){Store.resetAll();resetDraft();UI.renderAll();UI.show('home');UI.toast('Local data reset')}}
}

if(typeof document!=='undefined'&&document.addEventListener){
document.addEventListener('click',handleClick);
document.addEventListener('submit',e=>{if(e.target.id==='visitSetupForm'){e.preventDefault();startNewVisit(e.target)}});
document.addEventListener('change',e=>{if(e.target.id==='importBackup'){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state=Store.migrate(x);Store.save();resetDraft();UI.renderAll();UI.show('home');UI.toast('Backup imported')}catch(err){alert('Invalid backup file')}};r.readAsText(f)}});
document.addEventListener('input',e=>{if(['callOutlet','callOutletId','evidence','constraint','quickNote'].includes(e.target.id))persistDraftInputs()});
}

function runQA(){
 const original=localStorage.getItem(STORAGE_KEY); const qa=[]; const assert=(name,cond,detail='')=>qa.push({name,status:cond?'PASS':'FAIL',detail});
 try{
  state=clone(DEFAULT_STATE);Store.save();
  const v=Domain.newVisit({date:'2026-08-11',depot:'QA Depot',salesman:'QA Salesman',observer:'QA'});Store.upsertVisit(v);assert('QA-001 Create visit',!!Store.activeVisit());
  let c=Domain.newCall();c.outletName='Outlet A';c.routeStatus='JKS';c.result='EC';Domain.saveCall(v,c);assert('QA-002 Save EC call',v.calls.length===1&&Analyzer.visit(v).ec===1);
  c=Domain.newCall();c.outletName='Outlet B';c.result='NON_EC';c.observedPrimaryId='pic';c.sfaReasonId='pic';c.followupPlan='D+1';Domain.saveCall(v,c);assert('QA-003 Match classification',v.calls[1].reasonStatusFinal==='MATCH');
  c=Domain.newCall();c.outletName='Outlet C';c.result='NON_EC';c.observedPrimaryId='financial';c.sfaReasonId='pic';c.followupPlan='Next JKS';Domain.saveCall(v,c);assert('QA-004 Mismatch classification',v.calls[2].reasonStatusFinal==='MISMATCH');
  c=Domain.newCall();c.outletName='Outlet D';c.result='NON_EC';c.observedPrimaryId='financial';c.observedSecondaryId='stock';c.sfaReasonId='stock';c.followupPlan='D+2';Domain.saveCall(v,c);assert('QA-005 Partial classification',v.calls[3].reasonStatusFinal==='PARTIAL');
  const a=Analyzer.visit(v);assert('QA-006 KPI reconciliation',a.sc===4&&a.ec===1&&a.ne===3&&a.status.MATCH===1&&a.status.MISMATCH===1&&a.status.PARTIAL===1,JSON.stringify(a.status));
  const xml=(()=>{const rows=[['A','B'],[1,2]];return Exporter.worksheet('Test',rows)})();assert('QA-007 Excel XML generation',xml.includes('<Worksheet')&&xml.includes('<Row>'));
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));assert('QA-008 Local persistence',saved.visits.length===1&&saved.visits[0].calls.length===4);
  UI.renderAll();assert('QA-009 UI render',document.getElementById('homeScreen').innerHTML.length>100&&document.getElementById('visitScreen').innerHTML.length>100);
 }catch(err){qa.push({name:'QA runtime',status:'FAIL',detail:String(err?.stack||err)})}
 finally{if(original===null)localStorage.removeItem(STORAGE_KEY);else localStorage.setItem(STORAGE_KEY,original);state=Store.load();UI.renderAll()}
 const panel=document.getElementById('qaPanel');panel.style.display='block';panel.innerHTML=`<pre id="qaResults">${esc(JSON.stringify(qa,null,2))}</pre>`;console.log('QA_RESULTS',qa);
}
globalThis.__FVI_TEST__={Domain,Analyzer,Store,Exporter,DEFAULT_STATE,clone,getState:()=>state,setState:x=>{state=x}};
if(typeof document!=='undefined'&&document.getElementById){UI.renderAll();if(new URLSearchParams(location.search).get('qa')==='1')runQA();}
})();
</script>
